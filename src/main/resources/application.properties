spring.application.name=research-assistant
spring.main.banner-mode=off

# Demo database: an in-memory H2 database filled from schema.sql and data.sql at startup.
# Point these settings at your own database (and add its JDBC driver) to analyse real data.
spring.datasource.url=jdbc:h2:mem:research;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=embedded

# Keep the shell output readable
logging.level.root=WARN
