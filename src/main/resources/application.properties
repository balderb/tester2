spring.application.name=research-assistant
spring.main.banner-mode=off

# The CSV file to analyse at startup. A relative path is resolved from the folder you start the app in.
# Change it here, start the app with java -Dresearch.data-file=path/to/file.csv -jar ...,
# or switch files while the app runs with the 'load' command.
research.data-file=data/survey.csv

# Keep the shell output readable
logging.level.root=WARN
